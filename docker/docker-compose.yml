version: '3.9'
services:
  db:
    image: mysql:8.0
    container_name: socketio-db
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Tokyo
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "33306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: ./php
    container_name: socketio-php
    working_dir: /var/www/html
    env_file:
      - ../laravel/.env
    volumes:
      - ../laravel:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: socketio-nginx
    ports:
      - "8080:80"
    volumes:
      - ../laravel:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  nuxt:
    image: node:20-alpine
    container_name: socketio-nuxt
    working_dir: /app
    volumes:
      - ../nuxt:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000

volumes:
  db-data:
